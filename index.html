<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Masmorra Isométrica - VTT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <div id="hint">Navegação isométrica: Botão do Meio (arrastar) ou Scroll (zoom)</div>
  <div id="fpsbadge"></div>

  <!-- HUD Câmera The Sims -->
  <div id="sims-camera-controls" class="glass-panel">
    <div class="cam-row">
      <button class="cam-btn" id="camRotLeft" title="Girar Esquerda">↶</button>
      <button class="cam-btn" id="camUp" title="Subir Andar">▲</button>
      <button class="cam-btn" id="camRotRight" title="Girar Direita">↷</button>
    </div>
    <div class="cam-row">
      <button class="cam-btn" id="camZoomOut" title="Afastar (-)">➖</button>
      <button class="cam-btn" id="camDown" title="Descer Andar">▼</button>
      <button class="cam-btn" id="camZoomIn" title="Aproximar (+)">➕</button>
    </div>
    <div class="cam-row walls">
      <button class="cam-btn ativo" id="camWallFull" title="Paredes Erguidas">🧱</button>
      <button class="cam-btn" id="camWallCut" title="Paredes Transparentes">🪟</button>
      <button class="cam-btn" id="camWallLow" title="Paredes Rebaixadas">🕳️</button>
    </div>
  </div>

  <!-- HUD Principal The Sims -->
  <div id="sims-hud">
    <div id="sims-node">
      <button class="node-btn active" data-target="panel-construcao" title="Construção">🏗️</button>
      <button class="node-btn" data-target="panel-tabuleiro" title="Tabuleiro">♟️</button>
      <button class="node-btn" data-target="panel-imersao" title="Imersão">🌩️</button>
      <button class="node-btn" data-target="panel-grimorio" title="Grimório">📖</button>
    </div>

    <div id="sims-panel" class="glass-panel">
      <!-- ABA 1: CONSTRUÇÃO -->
      <div id="panel-construcao" class="sub-panel active">
        
        <div class="tool-group">
          <!-- BOTÕES DE HISTÓRICO -->
          <button class="tool-btn" id="btnDesfazer" title="Desfazer (Ctrl+Z)" style="background: rgba(255,255,255,0.1);">↩️</button>
          <button class="tool-btn" id="btnRefazer" title="Refazer (Ctrl+Shift+Z)" style="background: rgba(255,255,255,0.1);">↪️</button>
          <div class="divider"></div>
          
          <button class="tool-btn" id="btnModoSelecao" title="Selecionar e Mover Cômodo">🖱️</button>
          <button class="tool-btn" id="btnModoParede" title="Parede (Arraste para criar. Ctrl+Arraste = Marreta)">🧱</button>
          <button class="tool-btn" id="btnModoCerca" title="Cerca (Delimita sem fechar cômodo)">🚧</button>
          <button class="tool-btn" id="btnModoRetangulo" title="Sala Retangular (Arraste)">⬜</button>
          <button class="tool-btn" id="btnModoTriangulo" title="Sala Triangular (Arraste)">🔺</button>
          <button class="tool-btn" id="btnModoOctogono" title="Sala Octogonal (Arraste)">🛑</button>
          <button class="tool-btn" id="btnModoPorta" title="Portas/Janelas (Gruda na Parede)">🚪</button>
          <button class="tool-btn" id="btnModoPintura" title="Pintura (Ctrl = Borracha, Shift = Cômodo Inteiro)">🎨</button>
          <button class="tool-btn ativo" id="btnSairModo" title="Navegar / Sair">🖐️</button>
        </div>
        
        <div class="tool-group" style="margin-top: 8px;">
          <button class="tool-btn" id="btnModoEscada" title="Escadas (Arraste para definir a direção)">🪜</button>
          <button class="tool-btn" id="btnModoColuna" title="Coluna de Sustentação (Apoie varandas)">🏛️</button>
          <button class="tool-btn" id="btnModoTelhado" title="Telhados (Em breve)" style="opacity: 0.5;">🏠</button>
          <button class="tool-btn" id="btnModoTerreno" title="Paisagismo (Em breve)" style="opacity: 0.5;">🌳</button>
        </div>
        
        <div class="divider"></div>
        <div class="tool-group small-inputs">
          <div class="campoSims">Altura <input type="number" id="inputAlturaParede" value="3" min="0.5" max="10" step="0.5"></div>
          <div class="campoSims">Grid <input type="number" id="inputTamanhoGrid" value="1" min="0.25" max="4" step="0.25"></div>
        </div>
        <div class="divider"></div>
        
        <div id="paletaSecao">
          <div id="paletaBotoes">
            <button id="btnAdicionarTextura" title="Subir Imagem">🖼️</button>
            <input type="file" id="inputAdicionarTextura" accept="image/*" multiple style="display: none;">
            <input type="color" id="inputCorNova" value="#38bdf8" title="Nova Cor">
            <button id="btnAdicionarCor" title="Adicionar Cor">➕</button>
          </div>
          <div id="paletaTexturasWrap"><div id="paletaTexturas"></div></div>
        </div>
      </div>

      <!-- ABA 2: TABULEIRO -->
      <div id="panel-tabuleiro" class="sub-panel">
        <div class="hud-section">
          <h3>Tamanho do Tabuleiro</h3>
          <div class="linhaFerr">
            <span>Colunas (Eixo X)</span>
            <input type="number" id="inputMapaX" value="32" min="10" max="200" step="1">
          </div>
          <div class="linhaFerr">
            <span>Linhas (Eixo Z)</span>
            <input type="number" id="inputMapaZ" value="18" min="10" max="200" step="1">
          </div>
          <button class="wide" id="btnRedimensionarMapa" style="margin-top: 10px; border-color: #38bdf8; background: rgba(56,189,248,0.2); color: #38bdf8;">
            📐 Aplicar Novo Tamanho
          </button>
        </div>
      </div>

      <!-- Outras abas -->
      <div id="panel-imersao" class="sub-panel"></div>
      <div id="panel-grimorio" class="sub-panel"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
