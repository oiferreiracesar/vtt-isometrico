<div id="panel-construcao" class="sub-panel active">
  <div class="tool-group">
    <button class="tool-btn" id="btnModoParede" title="Modo Parede">🧱</button>
    <button class="tool-btn" id="btnModoRetangulo" title="Modo Retângulo">⬜</button>
    <button class="tool-btn" id="btnModoTriangulo" title="Modo Triângulo">🔺</button>
    <button class="tool-btn" id="btnModoOctogono" title="Modo Octógono">🛑</button>
    <button class="tool-btn" id="btnModoChao" title="Modo Chão (Piso)">⬛</button>
    <button class="tool-btn" id="btnModoPorta" title="Marcar Porta">🚪</button>
    <button class="tool-btn ativo" id="btnSairModo" title="Navegar / Sair">🖐️</button>
  </div>
  
  <div class="divider"></div>
  
  <div class="tool-group">
    <button class="tool-btn" id="btnDesfazerUltimo" title="Desfazer">↩️</button>
    <button class="tool-btn" id="btnPintarParede" title="Pintar Parede">🖌️</button>
    <button class="tool-btn" id="btnPintarPiso" title="Pintar Piso">🪣</button>
  </div>

  <div class="divider"></div>

  <div class="tool-group small-inputs">
    <div class="campoSims">Altura <input type="number" id="inputAlturaParede" value="3" min="0.5" max="10" step="0.5"></div>
    <div class="campoSims">Grid <input type="number" id="inputTamanhoGrid" value="1" min="0.25" max="4" step="0.25"></div>
  </div>

  <div class="divider"></div>

  <div id="paletaSecao">
    <div id="paletaBotoes">
      <button id="btnAdicionarTextura">🖼️</button>
      <input type="file" id="inputAdicionarTextura" accept="image/*" multiple style="display: none;">
      <input type="color" id="inputCorNova" value="#38bdf8">
      <button id="btnAdicionarCor">➕</button>
    </div>
    <div id="paletaTexturasWrap"><div id="paletaTexturas"></div></div>
  </div>
</div>
